<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanson · 训练 & 目标看板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'PingFang SC','Roboto','Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#0B0E14 0%,#101724 100%);color:#E8EEF7;-webkit-font-smoothing:antialiased;min-height:100vh}
  .page{max-width:980px;margin:0 auto;padding:28px 18px 56px}
  .header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:4px}
  .header h1{font-size:22px;font-weight:700;letter-spacing:.4px}
  .header h1 span{background:linear-gradient(90deg,#4FC3F7,#6FE37B);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:12.5px;color:#8B97AB;margin-top:6px}
  .tag{font-size:11px;color:#6FE37B;border:1px solid rgba(111,227,123,.35);padding:3px 10px;border-radius:999px;white-space:nowrap}
  .panel{background:rgba(23,31,46,.85);border:1px solid rgba(120,140,180,.16);border-radius:18px;padding:20px;margin-top:20px}
  .panel h2{font-size:15px;font-weight:600;color:#DDE6F2;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:#4FC3F7;box-shadow:0 0 10px #4FC3F7}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  @media(max-width:760px){.g2,.g3,.g5{grid-template-columns:1fr 1fr}.g5{grid-template-columns:1fr 1fr}}
  .card{background:rgba(15,22,34,.72);border:1px solid rgba(120,140,180,.14);border-radius:14px;padding:14px 15px}
  .card .label{font-size:11.5px;color:#8B97AB;letter-spacing:.3px}
  .card .value{font-size:24px;font-weight:700;margin-top:6px;line-height:1.1}
  .card .unit{font-size:12px;color:#8B97AB;font-weight:500;margin-left:3px}
  .card .hint{font-size:11px;color:#7d8ba1;margin-top:6px}
  .bar{height:7px;border-radius:999px;background:rgba(120,140,180,.18);overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4FC3F7,#6FE37B)}
  .bar.warn>i{background:linear-gradient(90deg,#FFB74D,#FF8A65)}
  .goal{background:rgba(15,22,34,.72);border:1px solid rgba(120,140,180,.14);border-radius:14px;padding:14px 15px}
  .goal .top{display:flex;justify-content:space-between;align-items:baseline}
  .goal .name{font-size:13px;color:#C7D2E3;font-weight:600}
  .goal .pct{font-size:13px;color:#6FE37B;font-weight:700}
  .goal .nums{font-size:11.5px;color:#8B97AB;margin-top:8px;display:flex;justify-content:space-between}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:#7d8ba1;font-weight:500;font-size:11.5px;padding:6px 8px;border-bottom:1px solid rgba(120,140,180,.16)}
  td{padding:8px;border-bottom:1px solid rgba(120,140,180,.08);color:#DCE4F0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12px;padding:7px 12px;border-radius:10px;background:rgba(15,22,34,.8);border:1px solid rgba(120,140,180,.16);color:#B8C4D6}
  .chip b{color:#E8EEF7}
  .chip.ok{border-color:rgba(111,227,123,.4);color:#9DE8A7}
  .chip.warn{border-color:rgba(255,183,77,.4);color:#FFCC80}
  .chip.bad{border-color:rgba(255,110,110,.45);color:#FF9E9E}
  .mini{display:flex;align-items:stretch;gap:3px;height:92px;margin-top:10px;overflow:hidden}
  .mini .col{flex:1;display:flex;flex-direction:row;align-items:flex-end;gap:2px;height:100%}
  .mini .col i{display:block;border-radius:3px 3px 0 0;min-height:2px;flex:1 1 0}
  .x{display:flex;margin-top:6px}
  .x span{flex:1;font-size:9px;color:#6f7c92;white-space:nowrap}
  .x span:last-child{text-align:right}
  .legend{font-size:11px;color:#7d8ba1;display:flex;gap:14px;margin-top:8px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  .empty{color:#6f7c92;font-size:12.5px;padding:6px 0}
  .foot{margin-top:26px;font-size:11px;color:#5f6b7f;text-align:center}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-month{font-size:14px;font-weight:600;color:#DDE6F2;letter-spacing:.3px}
  .cal-month small{font-size:11px;color:#7d8ba1;font-weight:400;margin-left:8px}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{background:rgba(15,22,34,.85);border:1px solid rgba(120,140,180,.22);color:#B8C4D6;border-radius:10px;width:34px;height:30px;font-size:14px;cursor:pointer;line-height:1}
  .cal-nav button:hover{border-color:rgba(79,195,247,.55);color:#8ED7FB}
  .cal-nav button:disabled{opacity:.3;cursor:default;border-color:rgba(120,140,180,.22);color:#B8C4D6}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-wd{font-size:10.5px;color:#6f7c92;text-align:center;padding-bottom:2px}
  .cal-cell{min-height:62px;border-radius:10px;border:1px solid rgba(120,140,180,.12);background:rgba(15,22,34,.6);padding:5px 6px;cursor:pointer;overflow:hidden}
  .cal-cell.empty{border:1px solid transparent;background:transparent;cursor:default}
  .cal-cell .d{font-size:10.5px;color:#7d8ba1}
  .cal-cell.has .d{color:#E8EEF7;font-weight:600}
  .cal-cell.today{box-shadow:inset 0 0 0 1px rgba(111,227,123,.55)}
  .cal-cell.sel{outline:2px solid #4FC3F7;outline-offset:-1px}
  .cal-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
  .cal-tag{font-size:9px;padding:1px 5px;border-radius:6px;white-space:nowrap;line-height:1.5;
           background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
  .cal-sum{font-size:9px;color:#7d8ba1;margin-top:3px}
  .cal-detail{margin-top:16px;border-top:1px solid rgba(120,140,180,.16);padding-top:14px}
  .cal-detail .cd-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:10px}
  .cal-detail .cd-date{font-size:13px;font-weight:600;color:#E8EEF7}
  .cal-detail .cd-meta{font-size:11.5px;color:#8B97AB}
  /* ---- mobile: square calendar cells, no wrapping ---- */
  @media(max-width:760px){
    .page{padding:18px 12px 44px}
    .panel{padding:14px;border-radius:16px;margin-top:14px}
    .panel h2{font-size:14px;margin-bottom:12px}
    .header h1{font-size:19px}
    .header .sub{font-size:11.5px}
    .cal-head{align-items:flex-start;margin-bottom:10px;gap:8px}
    .cal-month{font-size:13px;line-height:1.35}
    .cal-month small{display:block;margin:2px 0 0;font-size:10px}
    .cal-nav button{width:30px;height:26px;font-size:13px}
    .cal-grid{gap:3px}
    .cal-wd{font-size:9.5px;padding-bottom:4px}
    .cal-cell{aspect-ratio:1/1;min-height:0;padding:3px;border-radius:8px}
    .cal-cell .d{font-size:10px;line-height:1.2}
    .cal-cell .cal-tags{gap:3px;margin-top:3px}
    .cal-tag{font-size:0;width:7px;height:7px;border-radius:50%;padding:0;line-height:0;
             background:var(--c)}
    .cal-sum{display:none}
    .cal-cell.sel{outline-width:2px}
    /* keep wide tables from stretching the page */
    #todayTraining,#calDetail,#recent{overflow-x:auto}
    #todayTraining table th:last-child,#todayTraining table td:last-child,
    #calDetail table th:last-child,#calDetail table td:last-child,
    #recent table th:last-child,#recent table td:last-child{display:none}
    .goal .nums{flex-wrap:wrap;gap:2px}
    #today>.card:last-child{grid-column:1/-1}
    .charts-panel .g3{grid-template-columns:1fr}
    .charts-panel .mini{height:110px}
    table{font-size:11.5px}
    th{padding:5px 4px;font-size:10.5px}
    td{padding:6px 4px}
    td:first-child,th:first-child{padding-left:2px}
    td:last-child,th:last-child{padding-right:2px}
    .card .value{font-size:21px}
    .card{padding:12px}
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1><span>Vanson</span> · 训练 &amp; 目标看板</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div class="tag" id="tag">—</div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>目标进度</h2>
    <div class="grid g5" id="goals"></div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>今日</h2>
    <div class="grid g3" id="today"></div>
    <div style="margin-top:16px" id="todayTraining"></div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>部位空窗雷达</h2>
    <div class="chips" id="gaps"></div>
  </div>

  <div class="panel charts-panel">
    <h2><span class="dot"></span>近 14 天</h2>
    <div class="grid g3">
      <div class="card"><div class="label">训练容量 (kg)</div><div class="mini" id="mVol"></div><div class="x" id="xVol"></div></div>
      <div class="card"><div class="label">热量 / 蛋白</div><div class="mini" id="mCal"></div><div class="x" id="xCal"></div><div class="legend"><span><i style="background:#4FC3F7"></i>kcal</span><span><i style="background:#6FE37B"></i>蛋白 g</span></div></div>
      <div class="card"><div class="label">睡眠 (h)</div><div class="mini" id="mSleep"></div><div class="x" id="xSleep"></div></div>
    </div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>训练日历</h2>
    <div class="cal-head">
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-nav">
        <button id="calPrev" title="上个月">‹</button>
        <button id="calNext" title="下个月">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calDetail"></div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>最近训练</h2>
    <div id="recent"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

  ["睡眠", t.health.sleep!=null? `${num(t.health.sleep,2)}<span class="unit">h</span>` : "—",
    `步数 ${num(t.health.steps)} · 活动 ${num(t.health.active)}kcal`,
    t.health.date && t.health.date!==DATA.today ? `健康数据日期 ${t.health.date.slice(5)}` : null],
];
cards.forEach(([label,value,hint,extra])=>{
  todayEl.insertAdjacentHTML("beforeend", `
    <div class="card"><div class="label">${label}</div><div class="value">${value}</div>
    <div class="hint">${esc(hint||"")}</div>${extra?`<div class="hint">${esc(extra)}</div>`:""}</div>`);
});

const tt = document.getElementById("todayTraining");
tt.innerHTML = t.training.items.length
  ? `<table><thead><tr><th>动作</th><th class="num">重量×次数</th><th class="num">容量</th></tr></thead><tbody>
     ${t.training.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="num">${i.sets}</td><td class="num">${KG(i.volume)}</td></tr>`).join("")}
     </tbody></table>`
  : `<div class="empty">今天还没有训练记录。</div>`;

// gaps
const gapsEl = document.getElementById("gaps");
DATA.gaps.forEach(g=>{
  const cls = g.days==null? "" : g.days<=3? " ok" : g.days<=7? "" : g.days<=14? " warn" : " bad";
  gapsEl.insertAdjacentHTML("beforeend", `<div class="chip${cls}">${esc(g.name)} ${g.days==null?"<b>无记录</b>":`<b>${g.days} 天</b>`}</div>`);
});

// mini charts
function mini(el, xs, keys, colors, maxes, fmts){
  const host = document.getElementById(el);
  const xhost = document.getElementById(el.replace("m","x"));
  host.innerHTML = xs.map(x=>{
    const bars = keys.map((k,i)=>{
      const v = x[k]||0;
      const max = maxes[i] || Math.max(1, ...xs.map(y=>y[k]||0));
      const h = v>0 ? Math.max(2, Math.min(100, Math.round(v/max*100))) : 0;
      return `<i style="height:${h}%;background:${colors[i]}" title="${x.date} ${fmts[i](v)}"></i>`;
    }).join("");
    return `<div class="col">${bars}</div>`;
  }).join("");
  xhost.innerHTML = xs.map((x,i)=>
    `<span>${i===0 ? x.date.slice(5) : (i===xs.length-1 ? x.date.slice(5) : "")}</span>`).join("");
}
mini("mVol", DATA.series, ["volume"], ["linear-gradient(180deg,#4FC3F7,#2F80ED)"], [], [v=>num(v)+" kg"]);
mini("mCal", DATA.series, ["kcal","protein"],
     ["linear-gradient(180deg,#4FC3F7,#2F80ED)","linear-gradient(180deg,#6FE37B,#38B24A)"],
     [Math.max(2200, ...DATA.series.map(x=>x.kcal||0)), Math.max(120, ...DATA.series.map(x=>x.protein||0))],
     [v=>num(v)+" kcal", v=>num(v)+" g 蛋白"]);
mini("mSleep", DATA.series, ["sleep"], ["linear-gradient(180deg,#9B8CFF,#6C5CE7)"], [9], [v=>num(v,1)+" h"]);

// ---------- training calendar ----------
const CAL = DATA.calendar || {};
const PART_COLORS = {"胸":"#4FC3F7","背":"#6FE37B","腿":"#FFB74D","肩":"#9B8CFF",
                     "硬拉":"#FF8A65","RDL":"#FF8A65","有氧":"#4DD0E1","其他":"#8B97AB"};
let calMonth = DATA.today.slice(0,7);
let calSel = null;

function partTag(p){
  const c = PART_COLORS[p] || "#8B97AB";
  return `<span class="cal-tag" style="--c:${c}">${esc(p)}</span>`;
}

function renderCalendar(){
  const [y,m] = calMonth.split("-").map(Number);
  const pad = (new Date(y, m-1, 1).getDay() + 6) % 7;   // Monday-first
  const ndays = new Date(y, m, 0).getDate();
  let cells = "";
  for(let i=0;i<pad;i++) cells += `<div class="cal-cell empty"></div>`;
  let days=0, sets=0, vol=0;
  for(let d=1; d<=ndays; d++){
    const ds = `${calMonth}-${String(d).padStart(2,"0")}`;
    const info = CAL[ds];
    const cls = ["cal-cell"];
    if(info){ cls.push("has"); days++; sets += info.sets||0; vol += info.volume||0; }
    if(ds === DATA.today) cls.push("today");
    if(ds === calSel) cls.push("sel");
    cells += `<div class="${cls.join(" ")}"${info?` data-d="${ds}"`:""}>
      <div class="d">${d}</div>
      ${info ? `<div class="cal-tags">${(info.parts||[]).map(partTag).join("")}</div>
                <div class="cal-sum">${info.sets?info.sets+"组":""}${info.volume?" · "+KG(info.volume):""}</div>` : ""}
    </div>`;
  }
  document.getElementById("calGrid").innerHTML =
    ["一","二","三","四","五","六","日"].map(w=>`<div class="cal-wd">${w}</div>`).join("") + cells;
  document.getElementById("calMonth").innerHTML =
    `${y} 年 ${m} 月<small>训练 ${days} 天 · ${sets} 组 · ${KG(vol)} kg</small>`;
  document.querySelectorAll(".cal-cell.has").forEach(el=>{
    el.addEventListener("click", ()=> { calSel = (calSel===el.dataset.d ? null : el.dataset.d); renderCalendar(); });
  });
  document.getElementById("calNext").disabled = calMonth >= DATA.today.slice(0,7);
  renderDetail();
}

function renderDetail(){
  const box = document.getElementById("calDetail");
  const info = calSel && CAL[calSel];
  if(!info){ box.innerHTML = `<div class="cal-detail"><div class="empty">点日历上的训练日，看当天练了什么。</div></div>`; return; }
  box.innerHTML = `<div class="cal-detail">
    <div class="cd-head">
      <span class="cd-date">${calSel}</span>
      <span class="cd-meta">${(info.parts||[]).join(" / ")} · ${info.sets} 组 · ${KG(info.volume)} kg</span>
    </div>
    <table><thead><tr><th>动作</th><th class="num">重量×次数</th><th class="num">容量</th></tr></thead><tbody>
      ${info.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="num">${i.sets}</td><td class="num">${KG(i.volume)}</td></tr>`).join("")}
    </tbody></table>
  </div>`;
}

function gotoMonth(delta){
  const [y,m] = calMonth.split("-").map(Number);
  const dt = new Date(y, m-1+delta, 1);
  calMonth = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;
  const inMonth = Object.keys(CAL).filter(d=>d.slice(0,7)===calMonth).sort();
  calSel = inMonth.length ? inMonth[inMonth.length-1] : null;
  renderCalendar();
}

document.getElementById("calPrev").addEventListener("click", ()=>gotoMonth(-1));
document.getElementById("calNext").addEventListener("click", ()=>gotoMonth(1));
(function(){
  const inMonth = Object.keys(CAL).filter(d=>d.slice(0,7)===calMonth).sort();
  calSel = inMonth.length ? inMonth[inMonth.length-1] : null;
  renderCalendar();
})();

// recent sessions
const recEl = document.getElementById("recent");
recEl.innerHTML = `<table><thead><tr><th>日期</th><th>部位</th><th class="num">组数</th><th class="num">容量</th><th>主项</th></tr></thead><tbody>
${DATA.sessions.map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.parts)}</td><td class="num">${s.sets||"—"}</td><td class="num">${s.volume?KG(s.volume):"—"}</td><td>${esc(s.top)}</td></tr>`).join("")}
</tbody></table>`;

document.getElementById("foot").textContent = `数据每日自动重建 · 目标设定 2026-08-17 · 最近同步 ${DATA.lastHealthDate||"—"}`;
</script>
</body>
</html>
